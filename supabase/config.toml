# Local, non-production validation only. This checkout must not be linked remotely.
project_id = "turimap-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:4321"
additional_redirect_urls = ["http://localhost:4321"]

[storage]
enabled = true
file_size_limit = "50MiB"
